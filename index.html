<style>
  body{font-family:Tajawal,sans-serif;background:#f0f6ff}
  .card{background:#fff;border:1px solid #eff6ff;border-radius:1.5rem;box-shadow:0 1px 3px rgba(30,64,175,.06);padding:1.25rem}
  .mn-i{width:1em;height:1em;display:inline-block;vertical-align:-.15em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
  .mn-i .f{fill:currentColor;fill-opacity:.16;stroke:none}
  .mn-i .d{fill:currentColor;stroke:none}
  .mn-tile{display:inline-flex;align-items:center;justify-content:center;width:1.95rem;height:1.95rem;border-radius:.8rem;background:linear-gradient(135deg,#eff6ff,#dbeafe);color:#2563eb;font-size:1.1rem;box-shadow:inset 0 0 0 1px #bfdbfe;transition:all .2s}
  .mn-tile.mn-lg{width:2.8rem;height:2.8rem;border-radius:1rem;font-size:1.6rem}
  .mn-tile.mn-sm{width:1.75rem;height:1.75rem;border-radius:.7rem;font-size:1rem}
  .nb.on .mn-tile,.mn-tile.g{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.35)}
  .nb:hover .mn-tile{transform:translateY(-1px)}
  .mn-credit{margin:2rem auto 1rem;text-align:center;font-size:.7rem;color:#64748b;line-height:1.9}
  .mn-credit a{color:#2563eb;font-weight:700;text-decoration:none;direction:ltr;unicode-bidi:embed}
  .nb{color:#475569}
  .nb.on{background:#dbeafe;color:#2563eb;font-weight:700}
  .btn{background:#2563eb;color:#fff;font-weight:700;border-radius:1rem;padding:.6rem 1.1rem;font-size:.8rem}
  .btn:hover{background:#1d4ed8}
  .chip{border-radius:.75rem;padding:.2rem .6rem;font-size:.7rem;font-weight:700}
  .view{max-width:80rem;margin:0 auto}
  input,textarea,select{font-family:Tajawal,sans-serif}
  .ned ul{list-style:disc;padding-right:1.5rem;margin:.5rem 0}
  .ned ol{list-style:decimal;padding-right:1.5rem;margin:.5rem 0}
  .ned h1{font-size:1.6rem;font-weight:900;color:#1e3a8a;margin:.5rem 0}
  .ned h2{font-size:1.3rem;font-weight:800;color:#1e3a8a;margin:.5rem 0}
  .ned h3{font-size:1.1rem;font-weight:700;color:#1e3a8a;margin:.5rem 0}
  .ned img{max-width:100%;border-radius:12px;margin:.5rem 0}
  .ned a{color:#2563eb;text-decoration:underline}
  .ned:empty:before{content:"اكتب محتوى الملاحظة...";color:#94a3b8}
  .ned:focus{outline:none;border-color:#93c5fd}
  #modal>div{z-index:70!important}#toasts{z-index:80!important}
</style>

function go(t) { S.tab = t; render(); }

function renderNav() {
  const html = NAV.map(([id,label,em]) => `<button onclick="go('${id}')" class="nb w-full flex items-center gap-3 px-4 py-2.5 rounded-2xl hover:bg-blue-50 ${S.tab===id?'on':''}">${tile(em)}<span>${label}</span></button>`).join('');
  $('navSide').innerHTML = html;
  $('navBottom').innerHTML = NAV.map(([id,label,em]) => `<button onclick="go('${id}')" class="py-2 flex flex-col items-center ${S.tab===id?'text-blue-600':'text-slate-500'}">${tile(em, 'sm', S.tab===id)}<span class="mt-0.5">${label}</span></button>`).join('');
}

function render() {
  renderNav();
  $('v').innerHTML = V[S.tab]();
}

function newNote() {
  const n = {id: Date.now(), title: 'ملاحظة جديدة', content: '', tag: 'عام', date: new Date().toLocaleDateString('ar-EG')};
  S.notes.unshift(n); S.sel = n.id; save(); toast('أُنشئت ملاحظة جديدة');
}
function editNote(f, v) { const n = cur(); if (n) { n[f] = v; save(); } }
function saveNote() { save(); toast('تم حفظ الملاحظة'); }
function delNote() {
  if (!confirm('حذف هذه الملاحظة؟')) return;
  S.notes = S.notes.filter(n => n.id !== S.sel); S.sel = S.notes[0]?.id ?? null; save(); render();
}

function addTask() {
  const i = $('ti'), text = i.value.trim();
  if (!text) return;
  S.tasks.push({id: Date.now(), text, pri: $('tp').value, done: false, when: ''});
  save(); render(); toast('تمت إضافة المهمة');
}
function togTask(id) { const t = S.tasks.find(x => x.id === id); if (t) { t.done = !t.done; save(); render(); } }
function delTask(id) { S.tasks = S.tasks.filter(x => x.id !== id); save(); render(); }

/* ===== Persistent calendar, files and library ===== */
const ydm = (y,m,d) => `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const fmtSize = b => b >= 1048576 ? (b/1048576).toFixed(1)+' MB' : Math.max(1, Math.round(b/1024))+' KB';
const EXT = {pdf:['PDF','bg-red-50 text-red-600','📕'],doc:['Word','bg-blue-50 text-blue-600','📘'],docx:['Word','bg-blue-50 text-blue-600','📘'],xls:['Excel','bg-emerald-50 text-emerald-600','📗'],xlsx:['Excel','bg-emerald-50 text-emerald-600','📗'],ppt:['PowerPoint','bg-amber-50 text-amber-600','📙'],pptx:['PowerPoint','bg-amber-50 text-amber-600','📙'],jpg:['Image','bg-purple-50 text-purple-600','🖼️'],jpeg:['Image','bg-purple-50 text-purple-600','🖼️'],png:['Image','bg-purple-50 text-purple-600','🖼️'],txt:['Text','bg-slate-100 text-slate-600','📄']};
const KNOWN = ['PDF','Word','Excel','PowerPoint','Image','Text'];
const extOf = n => EXT[(n.split('.').pop() || '').toLowerCase()] || ['أخرى','bg-slate-100 text-slate-600','📎'];
const BCOL = ['#1e293b','#2563eb','#7c3aed','#059669','#db2777','#d97706'];

S.cal = S.cal || {y:2025, m:3};
S.selDay = S.selDay || 15;
S.fcat = S.fcat || 'الكل';
S.bfav = S.bfav || false;
S.events = load('mn_events', Object.entries(EV).flatMap(([d,list]) => list.map(([t,tm,c],i) => ({id:+d*100+i, date:ydm(2025,3,+d), title:t, time:tm, color:c}))));
S.files = load('mn_files', FILES.map(([n,s,t,c,i],k) => ({id:k+1, name:n, size:s, type:t, cls:c, icon:i, fav:false})));
S.books = load('mn_books', BOOKS.map(([t,a,c],k) => ({id:k+1, title:t, author:a, color:c, fav:k===0})));

const save2 = () => {
  const ok = [lsSet('mn_events', S.events), lsSet('mn_files', S.files), lsSet('mn_books', S.books)].every(Boolean);
  if (!ok) warnFull();
  return ok;
};

V.calendar = () => {
  const {y,m} = S.cal;
  const days = new Date(y, m+1, 0).getDate();
  const offset = (new Date(y, m, 1).getDay() + 1) % 7; // الأسبوع يبدأ بالسبت
  const cells = [...Array(offset).fill(null), ...Array.from({length:days}, (_,i) => i+1)];
  while (cells.length % 7) cells.push(null);
  const dayEv = d => S.events.filter(e => e.date === ydm(y, m, d));
  const monthName = new Date(y, m, 1).toLocaleDateString('ar-EG', {month:'long', year:'numeric'});
  const prefix = `${y}-${String(m+1).padStart(2,'0')}`;
  const upcoming = S.events.filter(e => e.date.startsWith(prefix)).sort((a,b) => a.date.localeCompare(b.date)).slice(0,5);
  const sel = dayEv(S.selDay);
  return `
  <div class="view grid grid-cols-1 lg:grid-cols-12 gap-6">
    <div class="lg:col-span-9 space-y-4">
      <div class="card flex flex-wrap justify-between items-center gap-3">
        <div><h2 class="font-black text-blue-900">تنظيم وقتك .. يصنع إنجازاتك</h2><p class="text-xs text-slate-400">مع Mnote+، لا تفوت أي موعد مهم</p></div>
        <div class="flex items-center gap-2 font-bold text-blue-900">
          <button onclick="calNav(-1)" class="w-8 h-8 rounded-xl bg-blue-50 text-blue-600">›</button>
          <span class="min-w-40 text-center">${monthName}</span>
          <button onclick="calNav(1)" class="w-8 h-8 rounded-xl bg-blue-50 text-blue-600">‹</button>
        </div>
      </div>
      <div class="card">
        <div class="grid grid-cols-7 text-center gap-2 text-xs font-bold text-slate-400 bg-blue-50/50 p-2 rounded-2xl mb-2">
          ${['السبت','الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'].map(d => `<span>${d}</span>`).join('')}
        </div>
        <div class="grid grid-cols-7 gap-2">
          ${cells.map(d => d === null ? '<div></div>' : `
            <div onclick="pickDay(${d})" class="min-h-20 p-1.5 rounded-xl border cursor-pointer text-xs space-y-1 ${d===S.selDay ? 'border-2 border-blue-500 bg-blue-50/60' : 'border-blue-50 bg-white hover:border-blue-200'}">
              <div class="font-bold text-blue-900">${d}</div>
              ${dayEv(d).slice(0,2).map(e => `<div class="${COL[e.color]} rounded-md px-1.5 py-0.5 truncate text-[10px]">${esc(e.title)}</div>`).join('')}
              ${dayEv(d).length > 2 ? `<div class="text-[10px] text-slate-400">+${dayEv(d).length-2}</div>` : ''}
            </div>`).join('')}
        </div>
      </div>
    </div>
    <div class="lg:col-span-3 space-y-4">
      <div class="card space-y-3 text-xs">
        <h3 class="font-extrabold text-sm text-blue-900">مواعيد ${S.selDay} ${monthName}</h3>
        ${sel.length ? sel.map(e => `<div class="flex justify-between items-center p-3 rounded-2xl bg-blue-50/40 border border-blue-100"><div><b>${esc(e.title)}</b><div class="text-slate-400">${esc(e.time)}</div></div><button onclick="delEvent(${e.id})" class="text-slate-300 hover:text-red-500">${ic('x')}</button></div>`).join('') : '<p class="text-slate-400">لا توجد مواعيد في هذا اليوم</p>'}
        <div class="space-y-2 pt-2 border-t border-blue-50">
          <input id="ev-t" placeholder="عنوان الموعد" class="w-full bg-blue-50/60 border border-blue-100 rounded-xl px-3 py-2 focus:outline-none">
          <div class="flex gap-2">
            <input id="ev-tm" placeholder="10:00 ص" class="flex-1 bg-blue-50/60 border border-blue-100 rounded-xl px-3 py-2 focus:outline-none">
            <select id="ev-c" class="bg-blue-50 border border-blue-100 rounded-xl px-2">
              <option value="blue">موعد</option><option value="green">مهمة</option><option value="purple">حدث</option><option value="amber">اجتماع</option><option value="pink">امتحان</option>
            </select>
          </div>
          <button onclick="addEvent()" class="btn w-full">+ إضافة موعد</button>
        </div>
      </div>
      <div class="card space-y-2 text-xs">
        <h3 class="font-extrabold text-sm text-blue-900">قادمة هذا الشهر</h3>
        ${upcoming.map(e => `<div class="flex justify-between p-2 rounded-xl bg-blue-50/40"><span>${esc(e.title)}</span><span class="text-slate-400">${e.date.slice(8)}</span></div>`).join('') || '<p class="text-slate-400">لا توجد مواعيد</p>'}
      </div>
    </div>
  </div>`;
};

V.files = () => {
  const cats = ['الكل', ...KNOWN, 'أخرى'];
  const inCat = (f, c) => c === 'الكل' || (c === 'أخرى' ? !KNOWN.includes(f.type) : f.type === c);
  const shown = S.files.filter(f => inCat(f, S.fcat));
  return `
  <div class="view space-y-6">
    <div class="card flex flex-wrap justify-between items-center gap-4">
      <div><h2 class="text-lg font-black text-blue-900">المكتبة والملفات</h2><p class="text-xs text-slate-400">كل ملفاتك في مكان واحد</p></div>
      <div class="flex gap-2"><button onclick="newNotebook()" class="btn">+ دفتر جديد</button><label class="btn cursor-pointer">${ic('up')} رفع ملف<input type="file" multiple class="hidden" onchange="addFiles(this)"></label></div>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-8 gap-3 text-center text-xs">
      ${cats.map(c => `<button onclick="S.fcat='${c}';render()" class="card !p-3 space-y-1 ${S.fcat===c ? '!bg-blue-600 !text-white' : ''}"><div class="font-bold">${c}</div><div class="opacity-70">${S.files.filter(f => inCat(f,c)).length}</div></button>`).join('')}
    </div>
    <div class="card space-y-2">
      <h3 class="font-extrabold text-sm text-blue-900 mb-2">الملفات (${shown.length})</h3>
      ${shown.map(f => `<div class="flex items-center justify-between p-3 rounded-2xl bg-blue-50/30 border border-blue-100 text-xs gap-2"><div onclick="openFile(${f.id})" class="flex items-center gap-3 min-w-0 flex-1 cursor-pointer"><span>${tile(f.icon)}</span><span class="font-bold text-blue-900 truncate">${esc(f.name)}</span></div><div class="flex items-center gap-3 text-slate-500 shrink-0"><span class="hidden sm:inline">${esc(f.size)}</span><span class="chip ${f.cls}">${esc(f.type)}</span><button onclick="openFile(${f.id})" class="btn !py-1 !px-3 !text-[11px]">فتح</button><button onclick="togFile(${f.id})" class="${f.fav ? 'text-amber-400' : 'text-slate-300'}">${ic('star')}</button><button onclick="delFile(${f.id})" class="text-slate-300 hover:text-red-500">${ic('x')}</button></div></div>`).join('') || '<p class="text-xs text-slate-400">لا توجد ملفات في هذا القسم</p>'}
    </div>
    <p class="text-[11px] text-slate-400">اضغط «فتح» لعرض الملف داخل التطبيق والكتابة عليه بالقلم أو التظليل أو النص. تُحفظ الملفات وتعديلاتها في هذا المتصفح فقط.</p>
  </div>`;
};

V.library = () => {
  const shown = S.books.filter(b => !S.bfav || b.fav);
  return `
  <div class="view space-y-6">
    <div class="card flex flex-wrap justify-between items-center gap-4">
      <div><h2 class="text-lg font-black text-blue-900">${ic('library')} مكتبتي</h2><p class="text-xs text-slate-400">كل كتبك في مكان واحد</p></div>
      <button onclick="S.bfav=!S.bfav;render()" class="px-4 py-2 rounded-2xl text-xs font-bold ${S.bfav ? 'bg-blue-600 text-white' : 'bg-blue-50 text-blue-600'}">${ic('star')} المفضلة</button>
    </div>
    <div class="card space-y-3">
      <h3 class="font-extrabold text-sm text-blue-900">إضافة كتاب</h3>
      <div class="flex flex-wrap gap-2">
        <input id="bk-t" placeholder="عنوان الكتاب" class="flex-1 min-w-40 bg-blue-50/60 border border-blue-100 rounded-xl px-3 py-2 text-xs focus:outline-none">
        <input id="bk-a" placeholder="المؤلف" class="flex-1 min-w-32 bg-blue-50/60 border border-blue-100 rounded-xl px-3 py-2 text-xs focus:outline-none">
        <button onclick="addBook()" class="btn">إضافة</button>
      </div>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      ${shown.map(b => `<div class="card space-y-3"><div class="h-40 rounded-2xl flex items-center justify-center text-white font-black text-center p-3" style="background:${b.color}">${esc(b.title)}</div><div class="flex justify-between items-start gap-2"><div class="min-w-0"><div class="font-bold text-sm text-blue-900 truncate">${esc(b.title)}</div><div class="text-[11px] text-slate-400 truncate">${esc(b.author || '—')}</div></div><div class="flex gap-1 shrink-0"><button onclick="togBook(${b.id})" class="${b.fav ? 'text-amber-400' : 'text-slate-300'}">${ic('star')}</button><button onclick="delBook(${b.id})" class="text-slate-300 hover:text-red-500">${ic('x')}</button></div></div></div>`).join('') || '<p class="text-xs text-slate-400 col-span-full">لا توجد كتب في هذا القسم</p>'}
    </div>
    <div class="card text-xs grid grid-cols-2 md:grid-cols-4 gap-3 text-center">
      <div class="p-3 rounded-2xl bg-blue-50/50"><b class="text-blue-900 text-lg block">${S.books.length}</b>الكتب</div>
      <div class="p-3 rounded-2xl bg-blue-50/50"><b class="text-blue-900 text-lg block">${S.notes.length}</b>الملاحظات</div>
      <div class="p-3 rounded-2xl bg-blue-50/50"><b class="text-blue-900 text-lg block">${S.files.length}</b>الملفات</div>
      <div class="p-3 rounded-2xl bg-blue-50/50"><b class="text-blue-900 text-lg block">${S.books.filter(b => b.fav).length}</b>المفضلة</div>
    </div>
    <a href="https://www.hindawi.org/books/" target="_blank" rel="noopener" class="block text-center text-xs text-blue-600 font-bold">تصفح مكتبة هنداوي</a>
  </div>`;
};

function calNav(dir) {
  let {y, m} = S.cal; m += dir;
  if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; }
  S.cal = {y, m}; S.selDay = 1; render();
}
function pickDay(d) { S.selDay = d; render(); }
function addEvent() {
  const t = $('ev-t').value.trim();
  if (!t) { toast('اكتب عنوان الموعد أولاً'); return; }
  S.events.push({id:Date.now(), date:ydm(S.cal.y, S.cal.m, S.selDay), title:t, time:$('ev-tm').value.trim() || '—', color:$('ev-c').value});
  save2(); render(); toast('تمت إضافة الموعد');
}
function delEvent(id) { S.events = S.events.filter(e => e.id !== id); save2(); render(); }

function addFiles(input) {
  if (!canAdd(S.files.length, FREE.files)) return;
  const list = [...input.files], added = [];
  list.forEach((f, k) => {
    const [type, cls, icon] = extOf(f.name), o = {id:Date.now()+k, name:f.name, size:fmtSize(f.size), type, cls, icon, fav:false};
    S.files.unshift(o); added.push([o, f]);
  });
  input.value = '';
  save2(); render(); toast('تمت إضافة الملفات');
  added.forEach(([o, f]) => {
    if (f.size > BLOB_MAX) return;
    const id = 'b' + o.id, to = new Promise((_, r) => setTimeout(r, 8000));
    Promise.race([putBlob(id, f), to]).then(() => { o.blobId = id; save2(); cloudPut(id, f).then(ok => { if (ok) { o.cloud = 1; save2(); } }); }).catch(() => {});
  });
}
function togFile(id) { const f = S.files.find(x => x.id === id); if (f) { f.fav = !f.fav; save2(); render(); } }
function delFile(id) { const d = S.files.find(x => x.id === id); if (d) { if (d.blobId) { delBlob(d.blobId); cloudDel(d.blobId); } delBlob("ann_" + d.id); cloudDel("ann_" + d.id); } S.files = S.files.filter(x => x.id !== id); save2(); render(); }

function addBook() {
  if (!canAdd(S.books.length, FREE.books)) return;
  const t = $('bk-t').value.trim();
  if (!t) { toast('اكتب عنوان الكتاب أولاً'); return; }
  S.books.unshift({id:Date.now(), title:t, author:$('bk-a').value.trim(), color:BCOL[S.books.length % BCOL.length], fav:false});
  save2(); render(); toast('تمت إضافة الكتاب');
}
function togBook(id) { const b = S.books.find(x => x.id === id); if (b) { b.fav = !b.fav; save2(); render(); } }
function delBook(id) { S.books = S.books.filter(x => x.id !== id); save2(); render(); }

/* ===== Search and plans ===== */
const FREE = {files: 10, books: 5};
S.plan = load('mn_plan', 'free');
S.q = '';
if (!$('modal')) { const d = document.createElement('div'); d.id = 'modal'; document.body.appendChild(d); }

const isPro = () => S.plan === 'pro';
function canAdd(count, limit) {
  if (isPro() || count < limit) return true;
  toast('وصلت إلى حد النسخة المجانية');
  openUpgrade();
  return false;
}

function openUpgrade() {
  const pro = isPro();
  $('modal').innerHTML = `
  <div onclick="closeUpgrade()" class="fixed inset-0 bg-slate-900/40 z-50 flex items-center justify-center p-4">
    <div onclick="event.stopPropagation()" class="bg-white rounded-3xl max-w-lg w-full p-6 space-y-5 shadow-2xl">
      <div class="text-center space-y-1"><div class="text-3xl text-amber-500">${ic('crown')}</div><h3 class="font-black text-lg text-blue-900">Mnote+ المميزة</h3><p class="text-xs text-slate-400">اختر الخطة المناسبة لك</p></div>
      <div class="grid grid-cols-2 gap-3 text-xs">
        <div class="p-4 rounded-2xl border ${!pro ? 'border-blue-500 bg-blue-50/50' : 'border-blue-100'} space-y-2">
          <div class="font-black text-blue-900">المجانية</div><div class="text-slate-400">مجاناً</div>
          <ul class="space-y-1 text-slate-600"><li>• حتى ${FREE.files} ملفات</li><li>• حتى ${FREE.books} كتب</li><li>• ملاحظات ومهام غير محدودة</li></ul>
        </div>
        <div class="p-4 rounded-2xl border ${pro ? 'border-blue-500 bg-blue-50/50' : 'border-blue-100'} space-y-2">
          <div class="font-black text-blue-900">المميزة</div><div class="text-slate-400">تجريبي</div>
          <ul class="space-y-1 text-slate-600"><li>• ملفات وكتب بلا حد</li><li>• مزامنة سحابية (قريباً)</li><li>• ميزات الذكاء الاصطناعي (قريباً)</li></ul>
        </div>
      </div>
      ${pro
        ? '<button onclick="setPlan(\'free\')" class="w-full py-2.5 rounded-2xl bg-blue-50 text-blue-600 font-bold text-xs">العودة إلى الخطة المجانية</button>'
        : '<button onclick="setPlan(\'pro\')" class="btn w-full py-3">تفعيل المميزة (تجريبي)</button>'}
      <p class="text-[11px] text-slate-400 text-center">هذا التفعيل تجريبي، ولا يتم فيه أي دفع ولا تُربط بطاقة ولا تُحصّل رسوم.</p>
    </div>
  </div>`;
}
function closeUpgrade() { $('modal').innerHTML = ''; }
function setPlan(p) {
  S.plan = p;
  try { localStorage.setItem('mn_plan', JSON.stringify(p)); } catch {}
  closeUpgrade(); render();
  toast(p === 'pro' ? 'تم تفعيل المميزة (تجريبي)' : 'تم الرجوع إلى الخطة المجانية');
}

function gSearch(q) {
  S.q = q.trim();
  $('v').innerHTML = S.q ? V.search() : V[S.tab]();
}
function openEvent(d) {
  S.cal = {y: +d.slice(0,4), m: +d.slice(5,7) - 1};
  S.selDay = +d.slice(8);
  go('calendar');
}

V.search = () => {
  const q = S.q.toLowerCase();
  const hit = s => String(s ?? '').toLowerCase().includes(q);
  const notes = S.notes.filter(n => hit(n.title) || hit(plain(n.content)) || hit(tagsOf(n).join(' ')));
  const tasks = S.tasks.filter(t => hit(t.text) || hit(t.pri));
  const files = S.files.filter(f => hit(f.name) || hit(f.type));
  const books = S.books.filter(b => hit(b.title) || hit(b.author));
  const events = S.events.filter(e => hit(e.title) || hit(e.time));
  const total = notes.length + tasks.length + files.length + books.length + events.length;
  const sec = (title, items, fn) => items.length ? `<div class="card space-y-2"><h3 class="font-extrabold text-sm text-blue-900">${title} (${items.length})</h3>${items.map(fn).join('')}</div>` : '';
  const row = (onc, main, sub) => `<div onclick="${onc}" class="p-3 rounded-2xl bg-blue-50/40 border border-blue-100 text-xs cursor-pointer hover:bg-blue-50"><div class="font-bold text-blue-900">${esc(main)}</div><div class="text-slate-400 truncate">${esc(sub)}</div></div>`;
  return `<div class="view space-y-4">
    <div class="text-xs text-slate-500">نتائج البحث عن "<b>${esc(S.q)}</b>": ${total}</div>
    ${total === 0 ? '<div class="card text-center text-sm text-slate-400">لا توجد نتائج مطابقة</div>' : ''}
    ${sec('الملاحظات', notes, n => row(`S.sel=${n.id};go('notes')`, n.title, plain(n.content)))}
    ${sec('المهام', tasks, t => row(`go('tasks')`, t.text, t.pri + (t.done ? ' • مكتملة' : '')))}
    ${sec('الملفات', files, f => row(`go('files')`, f.name, f.type + ' • ' + f.size))}
    ${sec('الكتب', books, b => row(`go('library')`, b.title, b.author || ''))}
    ${sec('المواعيد', events, e => row(`openEvent('${e.date}')`, e.title, e.date + ' • ' + e.time))}
  </div>`;
};

function go(t) {
  S.tab = t; S.q = '';
  const i = $('gsearch'); if (i) i.value = '';
  render();
}
function render() {
  renderNav();
  $('v').innerHTML = S.q ? V.search() : V[S.tab]();
}

/* ===== Rich-text notes and tag labels ===== */
S.ntag = '';
const tagsOf = n => n.tags || (n.tag ? [n.tag] : []);
const plain = h => new DOMParser().parseFromString(h || '', 'text/html').body.textContent || '';
const bodyHTML = n => /<[a-z][\s\S]*>/i.test(n.content || '') ? n.content : esc(n.content || '').replace(/\n/g, '<br>');
const focusTag = () => { const i = $('tg'); if (i) i.focus(); };

function fmt(cmd, val) {
  const el = $('ned'); if (!el) return;
  el.focus();
  document.execCommand(cmd, false, val ?? null);
  editNote('content', el.innerHTML);
}
function insertCheck() { fmt('insertHTML', '<div>☐&nbsp;</div>'); }
function insertLink() { const u = prompt('أدخل الرابط'); if (u) fmt('createLink', u); }
function insertImg(input) {
  const f = input.files[0]; if (!f) return;
  if (f.size > 400 * 1024) { toast('الصورة كبيرة (الحد 400 KB)'); input.value = ''; return; }
  const r = new FileReader();
  r.onload = () => { fmt('insertImage', r.result); input.value = ''; };
  r.readAsDataURL(f);
}
function addTag() {
  const n = cur(), v = $('tg').value.trim();
  if (!n || !v) return;
  n.tags = [...new Set([...tagsOf(n), v])]; delete n.tag;
  save(); render(); focusTag();
}
function quickTag(t) {
  const n = cur(); if (!n) return;
  n.tags = [...new Set([...tagsOf(n), t])]; delete n.tag;
  save(); render();
}
function removeTag(i) {
  const n = cur(); if (!n) return;
  const t = tagsOf(n); t.splice(i, 1);

/* ===== Note attachments ===== */
const ATT_MAX = 1024 * 1024;
const saveNotesSafe = () => { try { localStorage.setItem('mn_notes', JSON.stringify(S.notes)); return true; } catch { return false; } };
const dataToBlob = d => {
  const mime = d.slice(5, d.indexOf(';')) || 'application/octet-stream';
  const bin = atob(d.slice(d.indexOf(',') + 1));
  const arr = new Uint8Array(bin.length);
  for (let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
  return new Blob([arr], {type: mime});
};

function attachFile(input) {
  const n = cur(), f = input.files[0];
  if (!n || !f) return;
  if (f.size > ATT_MAX) { toast('الحد الأقصى لحجم المرفق 1 MB'); input.value = ''; return; }
  const r = new FileReader();
  r.onload = () => {
    n.attachments = [...(n.attachments || []), {id: Date.now(), name: f.name, size: fmtSize(f.size), data: r.result}];
    if (saveNotesSafe()) toast('تم إرفاق الملف');
    else { n.attachments.pop(); save(); toast('مساحة التخزين المحلية ممتلئة، احذف بعض المرفقات'); }
    render();
  };
  r.readAsDataURL(f);
  input.value = '';
}

function openAttach(i) {
  const a = (cur()?.attachments || [])[i];
  if (!a) return;
  const url = a.url || URL.createObjectURL(dataToBlob(a.data));
  if (!window.open(url, '_blank')) toast('اسمح بالنوافذ المنبثقة لفتح الملف');
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

function removeAttach(i) {
  const n = cur(); if (!n || !confirm('حذف هذا المرفق؟')) return;
  n.attachments.splice(i, 1);
  save(); render();
}

function openRec() {

    </div>

async function toggleRec() {
  if (REC) { REC.mr.stop(); return; }
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) { toast('التسجيل غير مدعوم في هذا المتصفح'); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    const mr = new MediaRecorder(stream);
    const chunks = [], start = Date.now();
    const timer = setInterval(() => {
      const s = Math.floor((Date.now() - start) / 1000);
      if ($('rtime')) $('rtime').textContent = `${String(Math.floor(s / 60)).padStart(2,'0')}:${String(s % 60).padStart(2,'0')}`;
      if (s >= 90 && REC) REC.mr.stop();
    }, 500);
    mr.ondataavailable = e => chunks.push(e.data);
    mr.onstop = () => {
      clearInterval(timer);
      stream.getTracks().forEach(t => t.stop());
      if (mr.discard) return;
      const blob = new Blob(chunks, {type: mr.mimeType || 'audio/webm'});
      REC = null;
      attachBlob(new File([blob], `تسجيل ${new Date().toLocaleTimeString('ar-EG')}.webm`, {type: blob.type}));
    };
    mr.start();
    REC = {mr};
    $('rbtn').textContent = '■';
    $('rst').textContent = 'جارٍ التسجيل...';
  } catch { toast('لم يُسمح باستخدام الميكروفون'); }
}

    </div>
    <canvas id="pad" width="800" height="400" class="w-full bg-white border border-blue-100 rounded-2xl touch-none cursor-crosshair"></canvas>

      <button onclick="insertPad()" class="btn">إدراج في الملاحظة</button>
    </div>`);
  initPad();
}
function initPad() {
  const c = $('pad'), ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  PAD = {c, ctx, snaps: [], drawing: false, last: null};
  const pos = e => { const r = c.getBoundingClientRect(); return {x: (e.clientX - r.left) * c.width / r.width, y: (e.clientY - r.top) * c.height / r.height}; };
  c.onpointerdown = e => {
    c.setPointerCapture(e.pointerId);
    PAD.snaps.push(ctx.getImageData(0, 0, c.width, c.height));
    if (PAD.snaps.length > 30) PAD.snaps.shift();
    PAD.drawing = true; PAD.last = pos(e);
  };
  c.onpointermove = e => {
    if (!PAD.drawing) return;
    const p = pos(e);
    ctx.strokeStyle = $('pc').value; ctx.lineWidth = +$('ps').value;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(PAD.last.x, PAD.last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    PAD.last = p;
  };
  c.onpointerup = c.onpointercancel = () => { PAD.drawing = false; };
}
function undoPad() { if (PAD && PAD.snaps.length) PAD.ctx.putImageData(PAD.snaps.pop(), 0, 0); }
function clearPad() {
  if (!PAD) return;
  PAD.snaps.push(PAD.ctx.getImageData(0, 0, PAD.c.width, PAD.c.height));
  PAD.ctx.fillStyle = '#fff'; PAD.ctx.fillRect(0, 0, PAD.c.width, PAD.c.height);
}
function insertPad() {
  if (!PAD) return;
  const data = PAD.c.toDataURL('image/png');
  if (data.length > 700000) { toast('الرسم كبير، جرّب رسماً أبسط'); return; }
  closeModal();
  if (S.tab !== 'notes') go('notes');
  if (!cur()) { toast('أنشئ ملاحظة أولاً'); return; }
  fmt('insertImage', data);
  toast('تم إدراج الرسم');
}

const STOPWORDS = new Set(['من','في','على','إلى','الى','عن','أن','ان','التي','الذي','هذا','هذه','مع','كان','كانت','هو','هي','ما','لا','أو','او','و','ثم','قد','كل','بعد','قبل','بين','أي','the','and','of','to','is','are','was','for','with']);
function openTeacher() {

  openModal(`<div class="flex items-center gap-3">
      <img src="${IMG.teacher}" alt="المعلم الذكي" class="h-14 w-14 object-contain shrink-0 rounded-2xl bg-blue-50">
      <div><h3 class="font-black text-blue-900">المعلم الذكي</h3><p class="text-[11px] text-slate-400">يحلل ملاحظتك ويساعدك على المراجعة</p></div>
    </div>
    <div class="grid grid-cols-3 gap-2 text-xs">
      <button onclick="teach('sum')" class="p-3 rounded-2xl bg-blue-50 text-blue-700 font-bold">تلخيص</button>
      <button onclick="teach('key')" class="p-3 rounded-2xl bg-blue-50 text-blue-700 font-bold">أهم المصطلحات</button>
      <button onclick="teach('quiz')" class="p-3 rounded-2xl bg-blue-50 text-blue-700 font-bold">أسئلة مراجعة</button>
    </div>
    <div id="tout" class="text-sm leading-relaxed bg-blue-50/40 border border-blue-100 rounded-2xl p-4 min-h-[6rem] text-slate-700">اختر نوع المساعدة</div>
    <p class="text-[10px] text-slate-400">هذا المعلم يحلل النص محلياً بطريقة بسيطة، وليس نموذج ذكاء اصطناعي. لإجابات أعمق يلزم ربطه بخدمة ذكاء اصطناعي عبر خادم.</p>`);
}
function teach(mode) {
  const n = cur(); if (!n) return;
  const text = plain(n.content).trim();
  if (text.length < 20) { $('tout').textContent = 'الملاحظة قصيرة جداً، أضف بعض المحتوى أولاً.'; return; }
  const sents = text.split(/[.!؟?\n]+/).map(s => s.trim()).filter(s => s.length > 12);
  const wordsOf = s => (s.toLowerCase().match(/[\u0600-\u06FFa-z]{3,}/g) || []).filter(w => !STOPWORDS.has(w));
  const freq = {};
  wordsOf(text).forEach(w => freq[w] = (freq[w] || 0) + 1);
  const topW = Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 6).map(e => e[0]);
  const score = s => { const ws = wordsOf(s); return ws.reduce((t, w) => t + (freq[w] || 0), 0) / Math.max(ws.length, 1); };
  const best = sents.map((s, i) => ({s, i, v: score(s)})).sort((a, b) => b.v - a.v).slice(0, 3).sort((a, b) => a.i - b.i).map(x => x.s);
  let html = '';
  if (mode === 'sum') html = best.map(s => `• ${esc(s)}.`).join('<br>');
  else if (mode === 'key') html = topW.map(w => `<span class="chip bg-blue-100 text-blue-700 mr-1 mb-1 inline-block">${esc(w)}</span>`).join('');
  else html = sents.slice(0, 4).map((s, i) => `<div class="mb-2"><b>${i + 1}.</b> ما المقصود بما ورد في: «${esc(s.split(' ').slice(0, 8).join(' '))}...»؟</div>`).join('');
  $('tout').innerHTML = html || 'لم أجد ما يكفي للتحليل.';
}

let TEACH_AI = false;

async function hasAI() {
  try { return !!(await getSample()); } catch { return false; }

const noteText = () => plain(cur()?.content).trim();
function scheduleText() {
  const tasks = S.tasks.map(t => `- ${t.text} (الأولوية: ${t.pri}, ${t.done ? 'مكتملة' : 'غير مكتملة'}${t.when ? '، ' + t.when : ''})`).join('\n');
  const events = S.events.slice().sort((a, b) => a.date.localeCompare(b.date)).slice(0, 30).map(e => `- ${e.date} ${e.time}: ${e.title}`).join('\n');
  return `المهام:\n${tasks || 'لا توجد مهام'}\n\nالمواعيد:\n${events || 'لا توجد مواعيد'}`;
}

async function askAI(kind, custom) {
  const out = $('tout');
  const sample = await getSample();
  if (!sample) { out.textContent = 'الذكاء الاصطناعي غير متاح في هذه النسخة.'; return; }
  const task = custom || TASKS[kind]();
  const data = kind === 'plan' ? scheduleText() : noteText();
  if (!custom && kind !== 'plan' && !data) { out.textContent = 'افتح ملاحظة تحتوي على نص أولاً.'; return; }
  out.textContent = 'جارٍ التفكير...';
  try {
    const res = await sample(`${MED_RULES}\n\n${task}${data ? '\n\nالمادة:\n' + data : ''}`, {
      onText: ({text}) => { out.textContent = text; }
    });
    out.textContent = res.text;
  } catch (e) {
    out.textContent = e?.code === 'rate_limited' ? 'وصلت إلى حد الطلبات، حاول بعد قليل.' : 'تعذّر الحصول على رد، حاول مرة أخرى.';
  }
}

function act(kind) {
  if (TEACH_AI) return askAI(kind);
  if (kind === 'sum' || kind === 'quiz') return teach(kind === 'sum' ? 'sum' : 'quiz');
  $('tout').textContent = 'هذه الخدمة تحتاج إلى الذكاء الاصطناعي.';

function calcTime() {
  const toMin = v => { const [h, m] = v.split(':').map(Number); return h * 60 + m; };
  let d = toMin($('tc2').value) - toMin($('tc1').value);
  if (d < 0) d += 1440;
  $('tcr').textContent = `المدة: ${Math.floor(d / 60)} ساعة و ${d % 60} دقيقة`;
}
function addTime() {
  const [h, m] = $('tc1').value.split(':').map(Number);
  const total = (h * 60 + m + (+$('tc3').value || 0)) % 1440;
  const pad = x => String(x).padStart(2, '0');
  $('tcr').textContent = `الوقت الناتج: ${pad(Math.floor(total / 60))}:${pad(total % 60)}`;
}
function convertImg() {
  const f = $('cvf').files[0];
  if (!f) { toast('اختر صورة أولاً'); return; }
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);

    c.toBlob(b => {

  };
  img.src = URL.createObjectURL(f);
}
async function runTranslate() {

  out.textContent = 'جارٍ الترجمة...';

      onText: ({text: t}) => { out.textContent = t; }

function readDoc(f) {
  if (!f) return;
  if (f.size > 2 * 1024 * 1024) { toast('الملف كبير (الحد 2 MB)'); return; }
  const r = new FileReader();
  r.onload = () => {
    let t = r.result;
    if (/\.html?$/i.test(f.name)) t = plain(t);
    $('rdo').textContent = t.slice(0, 50000);
  };
  r.readAsText(f);
}

let SPEAK_ON = false;
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

function speak(text) {
  if (!SPEAK_ON || !window.speechSynthesis || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.slice(0, 1500));
  u.lang = 'ar-SA';
  speechSynthesis.speak(u);
}
function toggleSpeak() {
  SPEAK_ON = !SPEAK_ON;
  const b = $('spk');
  if (b) b.innerHTML = SPEAK_ON ? ic('vol') + ' تشغيل' : ic('mute') + ' صامت';
  if (!SPEAK_ON && window.speechSynthesis) speechSynthesis.cancel();
}
function voiceIn() {
  if (!SpeechRec) { toast('الإدخال الصوتي غير مدعوم في هذا المتصفح'); return; }
  const rec = new SpeechRec();
  rec.lang = 'ar-SA';
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  rec.onresult = e => { $('tq').value = e.results[0][0].transcript; askCustom(); };
  rec.onerror = () => toast('تعذّر الاستماع، تحقق من إذن الميكروفون');
  try { rec.start(); toast('تحدّث الآن...'); } catch { toast('تعذّر بدء الاستماع'); }
}
function addVoiceControls() {
  const q = $('tq'); if (!q) return;
  q.parentElement.insertAdjacentHTML('afterbegin', '<button onclick="voiceIn()" title="تحدّث" class="px-3 rounded-xl bg-blue-50 text-blue-700 font-bold">' + ic('mic') + '</button>');
  q.parentElement.insertAdjacentHTML('beforeend', `<button id="spk" onclick="toggleSpeak()" class="px-3 rounded-xl bg-blue-50 text-blue-700 text-xs font-bold">${SPEAK_ON ? ic('vol') + ' تشغيل' : ic('mute') + ' صامت'}</button>`);
}

function openPreview(a) {
  const d = a.data || '';
  let mime = d.startsWith('data:') ? d.slice(5, d.indexOf(';')) : '';
  if (!mime && a.type === 'audio') mime = 'audio/mp4';
  const src = a.url || URL.createObjectURL(dataToBlob(d));
  let body;
  if (mime.startsWith('image/')) body = `<img src="${src}" alt="" class="max-h-[60vh] w-auto mx-auto rounded-2xl">`;
  else if (mime.startsWith('audio/')) body = `<audio controls src="${src}" class="w-full"></audio>`;
  else if (mime.startsWith('video/')) body = `<video controls src="${src}" class="w-full max-h-[60vh] rounded-2xl"></video>`;
  else if (mime === 'application/pdf' || mime.startsWith('text/')) body = `<iframe src="${src}" class="w-full h-[60vh] rounded-2xl border border-blue-100"></iframe>`;
  else body = '<p class="text-xs text-slate-500">لا يمكن عرض هذا النوع داخل التطبيق.</p>';
  openModal(`<h3 class="font-black text-blue-900 break-all">${esc(a.name)}</h3>${body}

  $('cres').textContent = `المؤشر: ${b.toFixed(1)} كغ/م² (${cat})`;

function calcCrCl() {
  const age = +$('ca').value, wt = +$('cwt').value, cr = +$('ccr').value;

  if ($('cs').value === 'f') v *= 0.85;
  $('cres').textContent = `التقدير: ≈ ${v.toFixed(0)} مل/دقيقة`;
}

/* ===== Large attachments (IndexedDB) and PDF tools ===== */
const BLOB_MAX = 50 * 1024 * 1024;
const FILE_DB = new Promise((res, rej) => {
  const r = indexedDB.open('mnote-files', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('blobs');
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
async function putBlob(id, blob) {
  const db = await FILE_DB;
  return new Promise((res, rej) => {
    const t = db.transaction('blobs', 'readwrite');
    t.objectStore('blobs').put(blob, id);
    t.oncomplete = () => res();
    t.onerror = () => rej(t.error);
  });
}
async function getBlob(id) {
  const db = await FILE_DB;
  return new Promise((res, rej) => {
    const q = db.transaction('blobs').objectStore('blobs').get(id);
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  });
}
async function delBlob(id) {
  const db = await FILE_DB;
  db.transaction('blobs', 'readwrite').objectStore('blobs').delete(id);
}

async function addAttachment(n, f) {
  if (f.size > BLOB_MAX) { toast('الحد الأقصى لحجم المرفق 50 MB'); return false; }
  try {
    const blobId = 'b' + Date.now() + Math.random().toString(36).slice(2, 7);
    await putBlob(blobId, f);
    cloudPut(blobId, f).then(ok => { const a = n.attachments.find(x => x.blobId === blobId); if (ok && a) { a.cloud = 1; save(); } });
    n.attachments = [...(n.attachments || []), {id: Date.now(), name: f.name, size: fmtSize(f.size), mime: f.type || '', blobId}];
    if (!saveNotesSafe()) { n.attachments.pop(); delBlob(blobId); save(); toast('مساحة التخزين ممتلئة'); return false; }
    return true;
  } catch { toast('تعذّر حفظ الملف في المتصفح'); return false; }
}
function attachFile(input) {
  const n = cur(), f = input.files[0];
  input.value = '';
  if (!n || !f) return;
  addAttachment(n, f).then(ok => { if (ok) { toast('تم إرفاق الملف'); render(); } });
}
function attachBlob(f) {
  const n = cur(); if (!n) return;
  addAttachment(n, f).then(ok => { if (ok) { closeModal(); toast('تم إرفاق التسجيل'); render(); } });
}
function removeAttach(i) {
  const n = cur(); if (!n || !confirm('حذف هذا المرفق؟')) return;
  const a = n.attachments[i];
  if (a && a.blobId) delBlob(a.blobId);
  n.attachments.splice(i, 1);
  save(); render();
}

async function openPreview(a) {
  let mime = a.mime || '', src;
  if (a.blobId) {
    const b = await getBlob(a.blobId);
    if (!b) { toast('الملف غير موجود في المتصفح'); return; }
    mime = b.type || mime;
    src = URL.createObjectURL(b);
  } else {
    const d = a.data || '';
    mime = d.startsWith('data:') ? d.slice(5, d.indexOf(';')) : '';
    if (!mime && a.type === 'audio') mime = 'audio/mp4';
    src = a.url || URL.createObjectURL(dataToBlob(d));
  }
  let body;
  if (mime.startsWith('image/')) body = `<img src="${src}" alt="" class="max-h-[60vh] w-auto mx-auto rounded-2xl">`;
  else if (mime.startsWith('audio/')) body = `<audio controls src="${src}" class="w-full"></audio>`;
  else if (mime.startsWith('video/')) body = `<video controls src="${src}" class="w-full max-h-[60vh] rounded-2xl"></video>`;
  else if (mime === 'application/pdf' || mime.startsWith('text/')) body = `<iframe src="${src}" class="w-full h-[60vh] rounded-2xl border border-blue-100"></iframe>`;
  else body = '<p class="text-xs text-slate-500">لا يمكن عرض هذا النوع داخل التطبيق.</p>';
  const pdfBtn = (mime === 'application/pdf' && a.blobId) ? `<button onclick="openPdfTools('${a.blobId}')" class="btn">تعديل PDF</button>` : '';
  openModal(`<h3 class="font-black text-blue-900 break-all">${esc(a.name)}</h3>${body}
    <div class="flex justify-end gap-2">${pdfBtn}<button onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-100 text-xs font-bold">إغلاق</button></div>`);
}

let PDFLIB_PROMISE = null;
function loadPdfLib() {
  if (window.PDFLib) return Promise.resolve(window.PDFLib);
  if (!PDFLIB_PROMISE) PDFLIB_PROMISE = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js';
    s.onload = () => res(window.PDFLib);
    s.onerror = () => rej(new Error('تعذّر تحميل أداة PDF'));
    document.head.appendChild(s);
  });
  return PDFLIB_PROMISE;
}

async function runPdfEdit(blobId) {
  const out = $('pt-out');
  out.textContent = 'جارٍ المعالجة... (قد يستغرق الملف الكبير وقتاً)';
  try {
    const L = await loadPdfLib();
    const src = await getBlob(blobId);
    const doc = await L.PDFDocument.load(await src.arrayBuffer(), {ignoreEncryption: true});
    const parse = (s, total) => {
      const set = new Set();
      (s || '').split(',').forEach(p => {
        p = p.trim(); if (!p) return;
        const [a, b] = p.split('-').map(x => +x);
        for (let i = a; i <= (b || a); i++) if (i >= 1 && i <= total) set.add(i - 1);
      });
      return [...set].sort((x, y) => x - y);
    };

    const rot = $('pt-rot').value.trim().split(/\s+/);
    if (rot[0]) doc.getPage(+rot[0] - 1).setRotation(L.degrees(+(rot[1] || 90)));

    const sp = +$('pt-stp').value, st = $('pt-txt').value.trim();
    if (sp && st) {
      const font = await doc.embedFont(L.StandardFonts.Helvetica);
      const pg = doc.getPage(sp - 1);
      pg.drawText(st, {x: 40, y: pg.getHeight() - 50, size: 18, font, color: L.rgb(0.1, 0.3, 0.8)});
    }

    parse($('pt-del').value, doc.getPageCount()).slice().reverse().forEach(i => doc.removePage(i));

    let result = doc;
    const ext = parse($('pt-ext').value, doc.getPageCount());
    if (ext.length) {
      result = await L.PDFDocument.create();
      (await result.copyPages(doc, ext)).forEach(p => result.addPage(p));
    }

    const bytes = await result.save();
    const file = new File([bytes], `معدّل-${Date.now()}.pdf`, {type: 'application/pdf'});
    const ok = await addAttachment(cur(), file);
    if (ok) { closeModal(); toast('تم حفظ النسخة المعدّلة كمرفق جديد'); render(); }
  } catch (e) {
    out.textContent = 'تعذّر التعديل: ' + (e?.message || 'نص غير مدعوم في الختم، استخدم أحرفاً لاتينية');
  }
}

  const a = (cur()?.attachments || []).find(x => x.blobId === blobId);
  const b = await getBlob(blobId);
  if (!a || !b) { toast('الملف غير موجود في المتصفح'); return; }

  if (!dl) { toast('حفظ الملف على الجهاز غير متاح في هذه النسخة'); return; }
  try {
    await dl.save({filename: a.name, data: b});
    toast('تم حفظ الملف');
  } catch (e) {
    const msg = {
      declined: 'تم إلغاء الحفظ',
      rejected_extension: 'صيغة هذا الملف غير مدعومة للحفظ (مثل m4a وmp3)',
      too_large: 'الملف كبير جداً للحفظ',
      rate_limited: 'انتظر قليلاً ثم حاول مرة أخرى'
    }[e?.code] || 'الحفظ على الجهاز غير متاح هنا';
    toast(msg);
  }
}

let EXAMS = load('mn_exams', []);
const saveExams = () => { const ok = lsSet('mn_exams', EXAMS); if (!ok) warnFull(); return ok; };
const todayKey = () => { const d = new Date(); return ydm(d.getFullYear(), d.getMonth(), d.getDate()); };
const addDays = (key, k) => { const d = new Date(key + 'T00:00:00'); d.setDate(d.getDate() + k); return ydm(d.getFullYear(), d.getMonth(), d.getDate()); };
const daysLeft = key => Math.round((new Date(key + 'T00:00:00') - new Date(todayKey() + 'T00:00:00')) / 86400000);
const compact = key => key.replaceAll('-', '');

function addExam() {
  const title = $('ex-t').value.trim(), date = $('ex-d').value;
  if (!title || !date) { toast('أدخل اسم الامتحان وتاريخه'); return; }
  EXAMS.push({id: Date.now(), title, date});
  saveExams(); render(); toast('تمت إضافة الامتحان');
}
function delExam(id) { EXAMS = EXAMS.filter(e => e.id !== id); saveExams(); render(); }
function planExam(id) {
  const e = EXAMS.find(x => x.id === id); if (!e) return;
  const left = daysLeft(e.date);
  if (left < 0) { toast('هذا الامتحان انتهى'); return; }
  const n = Math.min(7, Math.max(left, 1));
  for (let k = 0; k < n; k++) {
    S.tasks.push({id: Date.now() + k, text: `مراجعة ${e.title} (${k + 1}/${n})`, pri: k >= n - 2 ? 'عالية' : 'متوسطة', done: false, when: addDays(todayKey(), k)});
  }
  save(); toast(`أُضيفت ${n} مهام مراجعة`); render();
}

}
function openGcal(title, dateKey) {

const NOTIFIED = new Set();
async function enableNotif() {
  try {
    if (!('Notification' in window)) { toast('الإشعارات غير مدعومة هنا، ستظهر التذكيرات داخل التطبيق'); return; }
    const p = await Notification.requestPermission();
    toast(p === 'granted' ? 'تم تفعيل إشعارات المتصفح' : 'ستظهر التذكيرات داخل التطبيق');
  } catch { toast('ستظهر التذكيرات داخل التطبيق'); }
}
function checkReminders() {
  const t = todayKey(), tom = addDays(t, 1);
  const items = [
    ...EXAMS.map(e => ({k: 'x' + e.id, date: e.date, title: 'امتحان: ' + e.title})),
    ...S.events.map(e => ({k: 'e' + e.id, date: e.date, title: e.title}))
  ];
  items.forEach(it => {
    const key = it.k + it.date;
    if ((it.date === t || it.date === tom) && !NOTIFIED.has(key)) {
      NOTIFIED.add(key);
      const msg = it.date === t ? `اليوم: ${it.title}` : `غداً: ${it.title}`;
      toast(msg);
      try { if (window.Notification && Notification.permission === 'granted') new Notification('Mnote+', {body: msg}); } catch {}
    }
  });
}
setInterval(checkReminders, 60000);
checkReminders();

/* --- Flashcards and interactive quizzes generated from the open note --- */
let STUDY = {kind: null, i: 0, flip: false, score: 0, done: false};

async function genStudy(kind) {
  const n = cur(), text = n ? plain(n.content).trim() : '';
  if (!text || text.length < 30) { toast('أضف محتوى للملاحظة أولاً'); return; }
  const sample = await getSample();
  if (!sample) { toast('توليد البطاقات والأسئلة يحتاج الذكاء الاصطناعي'); return; }
  const isCards = kind === 'cards';
  const shape = isCards
    ? '[{"front":"السؤال أو المصطلح","back":"الإجابة"}]'
    : '[{"q":"السؤال","choices":["الخيار 1","الخيار 2","الخيار 3","الخيار 4"],"answer":0,"why":"سبب الإجابة الصحيحة"}]';
  const prompt = `${MED_RULES}\n\nمن المادة التالية أنشئ ${isCards ? '8 بطاقات مراجعة' : '5 أسئلة اختيار من متعدد'}. أعد الناتج فقط كمصفوفة JSON صالحة بهذا الشكل: ${shape}. في الأسئلة، answer هو رقم الخيار الصحيح بدءاً من 0. لا تضف أي نص خارج JSON.\n\nالمادة:\n${text}`;
  toast('جارٍ التوليد...');
  try {
    const r = await sample(prompt);
    const arr = JSON.parse(r.text.replace(/```json|```/g, '').match(/\[[\s\S]*\]/)[0]);
    if (!Array.isArray(arr) || !arr.length) throw new Error('empty');
    n[isCards ? 'cards' : 'quiz'] = arr;
    save(); openStudy(kind);
  } catch { toast('تعذّر التوليد، حاول مرة أخرى'); }

let PDFJS_PROMISE = null;
function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (!PDFJS_PROMISE) PDFJS_PROMISE = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      res(window.pdfjsLib);
    };
    s.onerror = () => rej(new Error('تعذّر تحميل قارئ PDF'));
    document.head.appendChild(s);
  });
  return PDFJS_PROMISE;
}

async function studyPdf(blobId) {
  const att = (cur()?.attachments || []).find(x => x.blobId === blobId);
  const b = await getBlob(blobId);
  if (!att || !b) { toast('الملف غير موجود'); return; }
  toast('جارٍ استخراج النص...');
  try {
    const lib = await loadPdfJs();
    const doc = await lib.getDocument({data: await b.arrayBuffer()}).promise;
    const max = Math.min(doc.numPages, 40);
    let text = '';
    for (let p = 1; p <= max && text.length < 30000; p++) {
      const page = await doc.getPage(p);
      const c = await page.getTextContent();
      text += c.items.map(i => i.str).join(' ') + '\n';
    }
    text = text.replace(/[ \t]+/g, ' ').trim();
    if (text.length < 200) { toast('هذا الملف ممسوح ضوئياً ولا يحتوي نصاً قابلاً للقراءة'); return; }
    const note = {
      id: Date.now(),
      title: 'دراسة: ' + att.name.replace(/\.pdf$/i, ''),
      content: esc(text.slice(0, 30000)).replace(/\n/g, '<br>'),
      tags: ['دراسة', 'PDF'],
      date: new Date().toLocaleDateString('ar-EG'),
      attachments: []
    };
    S.notes.unshift(note);
    S.sel = note.id;
    save(); closeModal(); S.tab = 'notes'; render();
    toast(`تم استخراج النص من ${max} صفحة، ويمكنك الآن إنشاء الملخص والبطاقات`);
  } catch { toast('تعذّر قراءة الملف'); }
}

/* ---- merge helpers (per-item three-way merge, so devices never overwrite each other) ---- */
const COLL = ['notes', 'tasks', 'events', 'exams', 'books', 'files'];
const stableStr = o => JSON.stringify(o, (k, v) => (v && typeof v === 'object' && !Array.isArray(v)) ? Object.keys(v).sort().reduce((r, key) => (r[key] = v[key], r), {}) : v);

function isMissingAtt(a) { return !a.data && !a.blobId && !a.url; }
const attStub = a => { const r = {id: a.id, name: a.name, size: a.size}; if (a.blobId) r.blobId = a.blobId; if (a.cloud) r.cloud = 1; if (a.mime) r.mime = a.mime; if (a.type) r.type = a.type; if (a.url) r.url = a.url; return r; };

const toCloud = d => JSON.parse(JSON.stringify({notes: (d.notes || []).map(noteStub), tasks: d.tasks || [], events: d.events || [], exams: d.exams || [], books: d.books || [], files: d.files || [], set: d.set || {}}));
const cloudPayload = () => ({updatedAt: Date.now(), ...toCloud(localData())});
const baseOf = d => { const b = {}; for (const k of COLL) { b[k] = {}; (d[k] || []).forEach(x => { b[k][String(x.id)] = hOf(k === 'notes' ? noteStub(x) : x); }); } return b; };

let _cid = 0;
const takeCloudNote = (c, l) => ({...c, attachments: (c.attachments || []).map(a => ((l && (l.attachments || []).find(x => x.id === a.id)) || a))});
const copyOfCloud = c => ({...takeCloudNote(c, null), id: Date.now() + (++_cid), title: (c.title || '') + ' (نسخة من السحابة)'});

function mergeList(L, C, B, isNote, stats) {
  L = L || []; C = C || []; B = B || {};
  const norm = x => isNote ? noteStub(x) : x;
  const cMap = new Map(C.map(x => [String(x.id), x]));
  const out = [], seen = new Set();
  for (const l of L) {
    const k = String(l.id); seen.add(k);
    const c = cMap.get(k), b = B[k], hl = hOf(norm(l));
    if (!c) { if (b === undefined || b !== hl) out.push(l); continue; }   // new here / edited after being deleted elsewhere → keep; unchanged and deleted elsewhere → drop
    const hc = hOf(norm(c));
    if (hl === hc || b === hc) { out.push(l); continue; }                // identical, or only changed here
    if (b === hl) { out.push(isNote ? takeCloudNote(c, l) : c); continue; } // only changed elsewhere
    out.push(l);                                                         // changed on both sides: keep this device's version
    if (isNote) { out.push(copyOfCloud(c)); stats.conflicts++; }         // …and keep the other as a copy so nothing is lost
  }
  for (const c of C) {
    const k = String(c.id); if (seen.has(k)) continue;
    const b = B[k];
    if (b === undefined || b !== hOf(norm(c))) out.push(isNote ? takeCloudNote(c, null) : c); // new elsewhere / edited after deleted here
  }

}
function mergeData(local, cloud, base) {
  const stats = {conflicts: 0}, out = {};
  for (const k of COLL) out[k] = mergeList(local[k], cloud[k], base[k], k === 'notes', stats);
  out.set = {...(cloud.set || {}), ...(local.set || {})};
  return {data: out, stats};
}
function applyMerged(d) {
  S.notes = d.notes; S.tasks = d.tasks; S.events = d.events; EXAMS = d.exams; S.books = d.books; S.files = d.files; S.set = d.set;
  if (!S.notes.some(n => n.id === S.sel)) S.sel = S.notes[0]?.id ?? null;
  save(); save2(); saveExams();
}

const syncErrMsg = e => {

  if (c === 'permission-denied') return 'قواعد Firestore ترفض الوصول: انسخ القواعد من الإعدادات (بطاقة «قواعد Firestore») وانشرها في Firebase Console';
  if (c === 'unavailable' || c === 'auth/network-request-failed') return 'لا يوجد اتصال، ستُعاد المحاولة تلقائياً';
  if (c === 'not-found' || c === 'failed-precondition') return 'أنشئ قاعدة Firestore Database في Firebase أولاً';

let SYNCING = false, SYNC_AGAIN = false, SYNC_FAIL_AT = 0, SIZE_WARNED = false, UNSUB = null;
async function syncMerge(manual) {
  if (!UID || !FB) return;
  if (SYNCING) { SYNC_AGAIN = true; return; }
  SYNCING = true; setStatus('جارٍ المزامنة...');
  try {
    const prev = localStorage.getItem('mn_sync_uid');
    if (prev && prev !== UID) { localStorage.removeItem('mn_sync_base'); localStorage.removeItem('mn_synced_at'); }
    localStorage.setItem('mn_sync_uid', UID);
    const ref = FB.db.collection('users').doc(UID);
    const syncedAt = Number(localStorage.getItem('mn_synced_at') || 0);
    const fresh = FRESH_DEVICE && !syncedAt;
    let res = null;
    await FB.db.runTransaction(async tx => {
      const snap = await tx.get(ref);
      const cloud = snap.exists ? snap.data() : null;
      const local = localData();
      let base = load('mn_sync_base', null);
      if (!base && cloud && syncedAt >= (cloud.updatedAt || 0)) base = baseOf(cloud);
      base = base || {};
      let merged, conflicts = 0;
      if (cloud && fresh) { merged = {}; for (const k of [...COLL, 'set']) merged[k] = cloud[k] ?? local[k]; }
      else if (cloud) { const m = mergeData(local, cloud, base); merged = m.data; conflicts = m.stats.conflicts; }
      else merged = local;
      const payload = toCloud(merged);
      if (JSON.stringify(payload).length > 900000) { const e = new Error('size'); e.code = 'size'; throw e; }
      let ts = cloud ? (cloud.updatedAt || 0) : 0;
      const cloudBody = cloud ? (({updatedAt, ...rest}) => rest)(JSON.parse(JSON.stringify(cloud))) : null;
      if (!cloudBody || hOf(cloudBody) !== hOf(payload)) { ts = Date.now(); tx.set(ref, {updatedAt: ts, ...payload}); }
      res = {merged, ts, conflicts};
    });
    const before = hOf(toCloud(localData()));
    applyMerged(res.merged);
    localStorage.setItem('mn_sync_base', JSON.stringify(baseOf(res.merged)));
    localStorage.setItem('mn_synced_at', String(res.ts));
    LAST_PUSHED = JSON.stringify({...cloudPayload(), updatedAt: 0});
    SYNC_FAIL_AT = 0; SIZE_WARNED = false;
    if (before !== hOf(toCloud(localData()))) render();
    setStatus('متزامن ✓'); cloudBackfill();
    if (res.conflicts) toast('عُدّلت ملاحظة على جهازين: حفظت النسختين معاً');
    else if (manual) toast('تمت المزامنة');
  } catch (e) {
    SYNC_FAIL_AT = Date.now();
    setStatus(syncErrMsg(e));
    if (e && e.code === 'size' && !SIZE_WARNED) { SIZE_WARNED = true; toast(syncErrMsg(e)); }
    else if (manual) toast(syncErrMsg(e));
  } finally {
    SYNCING = false;
    if (SYNC_AGAIN) { SYNC_AGAIN = false; setTimeout(() => syncMerge(), 500); }
  }
}
function listenCloud() {
  if (UNSUB) UNSUB();
  UNSUB = FB.db.collection('users').doc(UID).onSnapshot(s => {
    if (!s.exists || s.metadata.hasPendingWrites) return;
    if ((s.data().updatedAt || 0) > Number(localStorage.getItem('mn_synced_at') || 0)) syncMerge();

}

  return `<div class="view mt-4"><div class="card space-y-3"><h3 class="font-extrabold text-sm text-blue-900">🔒 قواعد Firestore (مطلوبة لمزامنة الملفات)</h3>
    <p class="text-[11px] text-slate-500">الصقها في Firebase Console ثم Firestore Database ثم Rules، واضغط Publish. تسمح لكل مستخدم بوثيقته وملفاته فقط.</p>
    <pre dir="ltr" class="text-[10px] bg-slate-50 border border-blue-100 rounded-xl p-3 overflow-x-auto">${esc(RULES_TXT)}</pre>
    <button onclick="navigator.clipboard.writeText(RULES_TXT).then(()=>toast('تم نسخ القواعد'))" class="btn">نسخ القواعد</button></div></div>`;
}
function saveGKey() { const v = $('gk').value.trim(); if (v) localStorage.setItem('mn_gkey', v); else localStorage.removeItem('mn_gkey'); toast(v ? 'تم حفظ المفتاح' : 'تم حذف المفتاح'); }

const cOn = () => UID && FB;
const CH = 524288, CLOUD_MAX = 20 * 1048576;
const bcol = () => FB.db.collection('users').doc(UID).collection('blobs');
const u8b64 = u => { let s = ''; for (let i = 0; i < u.length; i += 32768) s += String.fromCharCode.apply(null, u.subarray(i, i + 32768)); return btoa(s); };
async function cloudPut(key, blob, ts) {
  if (!cOn() || blob.size > CLOUD_MAX) return false;
  try {
    const old = await bcol().doc(key).get(), u = new Uint8Array(await blob.arrayBuffer()), n = Math.max(1, Math.ceil(u.length / CH));
    for (let i = 0; i < n; i++) await bcol().doc(key + '~' + i).set({d: u8b64(u.subarray(i * CH, (i + 1) * CH))});
    await bcol().doc(key).set({n, type: blob.type || '', ts: ts || 0});
    for (let i = n; i < (old.exists ? old.data().n : 0); i++) bcol().doc(key + '~' + i).delete();
    return true;
  } catch { return false; }
}
async function cloudGet(key) {
  if (!cOn()) return null;
  try {
    const m = await bcol().doc(key).get(); if (!m.exists) return null;
    const {n, type, ts} = m.data(), parts = await Promise.all(Array.from({length: n}, (_, i) => bcol().doc(key + '~' + i).get().then(d => Uint8Array.from(atob(d.data().d), c => c.charCodeAt(0)))));
    return {blob: new Blob(parts, {type}), ts};
  } catch { return null; }
}
async function cloudDel(key) {
  if (!cOn()) return;
  try { const m = await bcol().doc(key).get(); if (!m.exists) return; for (let i = 0; i < m.data().n; i++) bcol().doc(key + '~' + i).delete(); bcol().doc(key).delete(); } catch {}
}
async function ensureBlob(key) {
  let b = await getBlob(key).catch(() => null); if (b) return b;
  const c = await cloudGet(key); if (!c) return null;
  await putBlob(key, c.blob).catch(() => {}); return c.blob;
}
let BF = false;
async function cloudBackfill() {
  if (BF || !cOn()) return; BF = true;
  try {
    for (const f of S.files) if (f.blobId && !f.cloud) { const b = await getBlob(f.blobId).catch(() => null); if (b && await cloudPut(f.blobId, b)) { f.cloud = 1; save2(); } }
    for (const n of S.notes) for (const a of n.attachments || []) if (a.blobId && !a.cloud) { const b = await getBlob(a.blobId).catch(() => null); if (b && await cloudPut(a.blobId, b)) { a.cloud = 1; save(); } }
  } finally { BF = false; }
}
const _op5 = openPreview;
openPreview = async function (a) { if (a.blobId) await ensureBlob(a.blobId); return _op5(a); };


initFB();
updateUserUI();
